    <title>Grid Scroll</title>
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

   #grid_projects {
    width: 100%;
    background: #000;
    padding: 20px;
    overflow-x: hidden;
}

.grid-row {
    display: grid;
    grid-template-columns: repeat(5, var(--cell-size, 20%));
    gap: 20px;
    margin: 0 auto 10px auto;
    justify-content: center;
}

.holder-img {
    width: 100%;
    height: var(--cell-height, 220px);
    overflow: hidden;
    transition: height 0.3s ease; /* smooth vertical growth */
}

.holder-img a {
    display: block;
    width: 100%;
    height: 100%;
}

.holder-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.container {
    height: 1000px;
    background: red;
}
</style>

<script>
 gsap.registerPlugin(ScrollTrigger);

let lenis;
if (typeof Lenis !== 'undefined') {
    lenis = new Lenis({
        duration: 1.2,
        easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
        direction: 'vertical',
        gestureDirection: 'vertical',
        smooth: true,
        mouseMultiplier: 1,
        smoothTouch: false,
        touchMultiplier: 2,
        infinite: false,
    });

    // Lenis animation frame
    function raf(time) {
        lenis.raf(time);
        requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    // GSAP integration with Lenis
    lenis.on('scroll', ScrollTrigger.update);
} else {
    console.warn('Lenis not loaded, using default scroll behavior');
}

window.addEventListener("load", () => {
    let row2Started = false;
    let row3Started = false;
    let row4Started = false;
    let row5Started = false;

    console.log(row2Started, row3Started, row4Started, row5Started);
    
    // Row 1 animation
    document.querySelectorAll("#row-1").forEach((row) => {
        ScrollTrigger.create({
            trigger: row,
            start: "top 80%",
            end: "bottom 20%",
            scrub: 0.5,
            onUpdate: (self) => {
                let newSize = 20 + self.progress * 50; 
                let newHeight = 300 + self.progress * 200;

                row.style.setProperty("--cell-size", newSize + "%");
                row.querySelectorAll(".holder-img").forEach(cell => {
                    cell.style.setProperty("--cell-height", newHeight + "px");
                    cell.style.height = newHeight + "px"; 
                });

                if (newSize >= 50 && !row2Started) {
                    row2Started = true;
                    startRow2Animation();
                }
            },
        });
    });

    function startRow2Animation() {
        document.querySelectorAll("#row-2").forEach((row) => {
            ScrollTrigger.create({
                trigger: row,
                start: "top 80%",
                end: "bottom 20%",
                scrub: 0.5,
                onUpdate: (self) => {
                    let newSize = 20 + self.progress * 50; 
                    let newHeight = 300 + self.progress * 200;

                    row.style.setProperty("--cell-size", newSize + "%");
                    row.querySelectorAll(".holder-img").forEach(cell => {
                        cell.style.setProperty("--cell-height", newHeight + "px");
                        cell.style.height = newHeight + "px"; 
                    });
                    if (newSize >= 45 && !row3Started) {
                        row3Started = true;
                        startRow3Animation();
                    }
                },
           
            });
        });
    }

    function startRow3Animation() {
        document.querySelectorAll("#row-3").forEach((row) => {
            ScrollTrigger.create({
                trigger: row,
                start: "top 80%",
                end: "bottom 20%",
                scrub: 0.5,
                onUpdate: (self) => {
                    let newSize = 20 + self.progress * 50; 
                    let newHeight = 300 + self.progress * 200;

                    row.style.setProperty("--cell-size", newSize + "%");
                    row.querySelectorAll(".holder-img").forEach(cell => {
                        cell.style.setProperty("--cell-height", newHeight + "px");
                        cell.style.height = newHeight + "px"; 
                    });
                    if (newSize >= 40 && !row4Started) {
                        row4Started = true;
                        startRow4Animation();
                    }
                },
              
            });
        });
    }

    function startRow4Animation() {

            ScrollTrigger.create({
                trigger: row,
                start: "top 80%",
                end: "bottom 20%",
                scrub: 0.5,
                onUpdate: (self) => {
                    let newSize = 20 + self.progress * 50; 
                    let newHeight = 300 + self.progress * 200;

                    row.style.setProperty("--cell-size", newSize + "%");
                    row.querySelectorAll(".holder-img").forEach(cell => {
                        cell.style.setProperty("--cell-height", newHeight + "px");
                        cell.style.height = newHeight + "px"; 
                    });
                    if (newSize >= 38 && !row5Started) {

            });

                        cell.style.setProperty("--cell-height", newHeight + "px");
                        cell.style.height = newHeight + "px"; 
                    });

            });

    }
});
