<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Scroll</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .hero-section {
            height: 100vh;
            width: 100%;
            background-color: yellow;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #grid_projects {
            height: auto;
            width: 100%;
            overflow-x: hidden;
            background: #000;
            padding: 20px;
        }

        .grid-row {
            display: grid;
            grid-template-columns: repeat(5, var(--cell-size, 302px));
            gap: 5px;
            margin: 0 auto 10px auto;
            justify-content: center;
            transition: grid-template-columns 0.3s ease;
        }

        .holder-img {
            width: 100%;
            height: var(--cell-height, 150px);
            overflow: hidden;
        }

        .holder-img a {
            display: block;
            width: 100%;
            height: 100%;
        }

        .holder-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .section3 {
            height: 80vh;
            width: 100%;
            background-color: blue;
            padding: 10% 2%;
        }
    </style>
</head>

    <script>
        // gsap.registerPlugin(ScrollTrigger);

        // document.querySelectorAll(".grid-row").forEach((row) => {
        //     ScrollTrigger.create({
        //         trigger: row,
        //         start: "top 80%",
        //         end: "bottom 20%",
        //         scrub: true,
        //         onUpdate: (self) => {
        //             let size = 220 * (1 + self.progress * 2.7); // width expand
        //             let height = 150 * (1 + self.progress * 2.3); // height expand
        //             row.style.setProperty("--cell-size", size + "px");
        //             row.style.setProperty("--cell-height", height + "px");
        //         }
        //     });
        // });
        
        gsap.registerPlugin(ScrollTrigger);

        window.addEventListener("load", () => {
            document.querySelectorAll(".grid-row").forEach((row) => {
                ScrollTrigger.create({
                    trigger: row,
                    start: "top 80%",
                    end: "bottom 0%",
                    scrub: true,
                    onUpdate: (self) => {
                        let size = 302 * (1 + self.progress * 2.5); // width expand
                        let height = 150 * (1 + self.progress * 1.7); // height expand
                        row.style.setProperty("--cell-size", size + "px");
                        row.style.setProperty("--cell-height", height + "px");
                    }
                });
            });

            ScrollTrigger.refresh();
        });
    </script>
