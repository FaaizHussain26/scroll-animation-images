<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Scroll</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

      

        #grid_projects {
            height: auto;
            width: 100%;
            overflow-x: hidden;
            background: #000;
            padding: 20px;
        }

        .grid-row {
            display: grid;
            grid-template-columns: repeat(5, var(--cell-size, 20%));
            gap: 5px;
            margin: 0 auto 10px auto;
            justify-content: center;
            transition: grid-template-columns 0.3s ease;
        }

        .holder-img {
            width: 100%;
            height: var(--cell-height, 150px);
            overflow: hidden;
        }

        .holder-img a {
            display: block;
            width: 100%;
            height: 100%;
        }

        .holder-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

    </style>
</head>

<body>

  

    <div id="grid_projects">
        <!-- Row 1 -->
        <div class="grid-row">
            <div class="holder-img"><a href="#"><img src="https://picsum.photos/id/1015/400/300" alt=""></a></div>
            <div class="holder-img"><a href="#"><img src="https://picsum.photos/id/1016/400/300" alt=""></a></div>
            <div class="holder-img"><a href="#"><img src="https://picsum.photos/id/1018/400/300" alt=""></a></div>
            <div class="holder-img"><a href="#"><img src="https://picsum.photos/id/1020/400/300" alt=""></a></div>
            <div class="holder-img"><a href="#"><img src="https://picsum.photos/id/1024/400/300" alt=""></a></div>
        </div>

        <!-- Row 2 -->
        <div class="grid-row">
            <div class="holder-img"><a href="#"><img src="https://picsum.photos/id/1025/400/300" alt=""></a></div>
            <div class="holder-img"><a href="#"><img src="https://picsum.photos/id/1031/400/300" alt=""></a></div>
            <div class="holder-img"><a href="#"><img src="https://picsum.photos/id/1033/400/300" alt=""></a></div>
            <div class="holder-img"><a href="#"><img src="https://picsum.photos/id/1035/400/300" alt=""></a></div>
            <div class="holder-img"><a href="#"><img src="https://picsum.photos/id/1037/400/300" alt=""></a></div>
        </div>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script>


        gsap.registerPlugin(ScrollTrigger);

        window.addEventListener("load", () => {
            document.querySelectorAll(".grid-row").forEach((row) => {
                ScrollTrigger.create({
                    trigger: row,
                    start: "top 80%",
                    end: "bottom 0%",
                    scrub: true,
                    // onUpdate: (self) => {
                    //     let size = 302 * (1 + self.progress * 2.5); // width expand
                    //     let height = 150 * (1 + self.progress * 1.7); // height expand
                    //     row.style.setProperty("--cell-size", size + "px");
                    //     row.style.setProperty("--cell-height", height + "px");
                    // }
                    onUpdate: (self) => {
                        // 20% base width, scaled with progress
                        let sizePercent = 20 * (1 + self.progress * 2.5);
                        let heightPx = 150 * (1 + self.progress * 1.7); // keep height in px

                        row.style.setProperty("--cell-size", sizePercent + "%");
                        row.style.setProperty("--cell-height", heightPx + "px");
                    }
                });
            });

            ScrollTrigger.refresh();
        });
    </script>
</body>

</html>
